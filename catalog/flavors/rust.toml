# Rust flavors. Derives (derive:Name), attributes (attr:path), trait implementations
# (impl:Trait, from-trait:Trait), visibility (pub, pub(crate)) and cfg conditions (#cfg(...)) are
# emitted with their names; the web shows them with generic explanations.

# --- Projects and modules ------------------------------------------------------------------

[rust]
label = "Rust"
explain = "A Rust project (Cargo)."

[bin]
label = "program"
explain = "The project builds an executable program (src/main.rs or [[bin]])."

[lib]
label = "library"
explain = "The project builds a library other crates can use (src/lib.rs)."

[workspace]
label = "workspace"
explain = "Several crates built together (a Cargo workspace)."

[crate-root]
label = "crate root"
explain = "The top module of a crate (main.rs or lib.rs): every other module hangs below it."

[inline-module]
label = "inline module"
explain = "A module written inside another file (mod name { ... }) instead of a file of its own."

[pub]
label = "pub"
explain = "Public: code outside this module can use it."

# --- Types ---------------------------------------------------------------------------------

[tuple-struct]
label = "tuple struct"
explain = "A struct whose fields have positions instead of names: value.0, value.1."

[unit-struct]
label = "unit struct"
explain = "A struct with no fields: it carries meaning only by its type."

[c-union]
label = "union"
explain = "All fields share the same memory; reading one is unsafe because Rust cannot know which one was written."

[impl-only]
label = "impl block"
explain = "Methods added to a type declared elsewhere (another module, or a type from another crate)."

[associated-type]
label = "associated type"
explain = "A type a trait leaves open; each implementation says what it is (type Item = u32)."

[macro]
label = "macro"
explain = "Code that writes code at compile time. name!(...) expands into ordinary Rust before it is compiled."

# --- Functions -----------------------------------------------------------------------------
cue = "!"
phase = "Compile time"
effects = [["name!(tokens)", "Expand the macro before compiling the resulting code"]]

["&self"]
label = "&self"
explain = "A method that reads the value it is called on, without changing or taking it."

["&mut self"]
label = "&mut self"
explain = "A method that may change the value it is called on; nobody else can use that value meanwhile."

[self]
label = "self"
explain = "A method that takes the value it is called on: afterwards the caller can no longer use it."

[static]
label = "associated function"
explain = "A function of the type that is not called on a value (Type::name(...)), such as a constructor."

[default]
label = "default body"
explain = "A trait method with a body: implementations get it for free unless they write their own."

[required]
label = "required"
explain = "A trait method without a body: every implementation must write it."

[const]
label = "const"
explain = "Computed while compiling (const fn may also run then); its value never changes."

[mut]
label = "mut"
explain = "The variable can be changed later. Rust variables are fixed unless marked mut."
cue = "mut"
phase = "Compile time"
effects = [["let mut n = 1; n = 2", "The binding can be reassigned"]]

[unsafe]
label = "unsafe"
explain = "Rust allows specific operations here that require extra safety conditions, such as dereferencing a raw pointer. The author must uphold those conditions. Type checking still applies."

[extern]
label = "extern"
explain = "A function from (or for) code written in another language, such as C."

[generic]
label = "generic"
explain = "Works for many types: the type is a parameter (fn f<T>(x: T)), chosen where it is used."

[test]
label = "test"
explain = "A test: cargo test runs it; it is not part of the program."

[callback]
label = "callback"
explain = "A function written inline and handed to another function, which calls it later (or for each item)."

[move]
label = "move"
explain = "The closure captures the values it uses by value. Copy values can be copied into it. Other values are moved."
cue = "move"
phase = "Compile time"
effects = [["Capture a Copy value", "Copy it into the closure"], ["Capture a non-Copy value", "Move it into the closure"]]

[async-trait]
label = "async trait"
explain = "Uses the async_trait macro so trait methods can be async."

[async-main]
label = "async main"
explain = "The program's entry point runs inside an async runtime (tokio::main)."

[inline]
label = "inline"
explain = "Asks the compiler to copy the function's body where it is called, for speed."

[must_use]
label = "must use"
explain = "The compiler warns if the result is ignored."

[deprecated]
label = "deprecated"
explain = "Should no longer be used; kept for old code."

[non_exhaustive]
label = "non exhaustive"
explain = "More variants or fields may be added later, so code outside the crate must handle unknown ones."

# --- Statements ----------------------------------------------------------------------------

[let-else]
label = "let … else"
explain = "Unpacks a value if it has the expected shape; otherwise runs the else block, which must leave (return, break, panic)."
cue = "else"
phase = "Runtime"
effects = [["Pattern matches", "Continue with the new bindings"], ["Pattern fails", "Run the diverging else block"]]

[if-let]
label = "if let"
explain = "Runs the branch only when the value has the given shape (Some(x), Ok(v)), and gives names to its parts."

[while-let]
label = "while let"
explain = "Repeats while the value has the given shape, for example while a queue still returns Some(item)."

[try]
label = "?"
explain = "Continue with the successful value or return early. For Result, this propagates Err with any required error conversion. For Option, it propagates None."
cue = "?"
phase = "Runtime"
effects = [["Success or presence", "Continue with the inner value"], ["Propagation is needed", "Return early from the enclosing context"]]

[panic]
label = "panic"
explain = "Stops the program (or this thread) with a message, unwinding the stack. Meant for bugs, not for expected errors."

[assert]
label = "assert"
explain = "Panics if the condition is false."

[iterator]
label = "iterator"
explain = "A chain of iterator steps: items flow through each step lazily, one at a time, until a step like sum() or collect() pulls them."

[channel]
label = "channel"
explain = "Sends a value to whoever holds the receiving end, often on another thread."

[drop]
label = "drop"
explain = "Frees the value now instead of at the end of its scope (closing files, releasing locks)."

[exits]
label = "exits"
explain = "Ends the whole program immediately; values are not cleaned up."

[blocking]
label = "blocking"
explain = "The thread stops here until it finishes; nothing else runs on it meanwhile."

# --- Expressions ---------------------------------------------------------------------------

[borrow]
label = "&"
explain = "A shared borrow: read access to the value; the owner keeps it."
cue = "&"
phase = "Runtime"
effects = [["let r = &x", "r accesses x through a shared reference"]]

[borrow-mut]
label = "&mut"
explain = "A mutable borrow: exclusive access to change the value; nobody else may use it meanwhile."
cue = "&mut"
phase = "Runtime"
effects = [["let r = &mut x", "r provides exclusive access to x"], ["*r = 2", "Write 2 through the reference"]]

[deref]
label = "*"
explain = "Follows a reference (or smart pointer) to the value it points to."
cue = "*"
phase = "Runtime"
effects = [["Read *r", "Access the referenced place"], ["Write through a writable *r", "Update the referenced place"]]

[clone]
label = "clone"
explain = "Makes a full copy of the value, so the original can still be used."

[may-panic]
label = "may panic"
explain = "unwrap()/expect() take the value out of Some/Ok, and stop the program (panic) if it is None/Err."

[variant]
label = "variant"
explain = "Creates a value of one case of an enum (Some(x), Ok(v), Shape::Circle(r))."

[function-value]
label = "function value"
explain = "Calls a function stored in a variable or field."

[captured]
label = "captured"
explain = "A variable named inside the format text ({name})."

[block]
label = "block value"
explain = "A block's last expression (without ;) is its value."

[loop-value]
label = "loop value"
explain = "A loop used as a value: break value ends it with that value."

[move-semantics]
label = "moved"
explain = "The value moves here: the previous owner can no longer use it."

[implicit-drop]
label = "dropped here"
explain = "Rust frees this value here on its own, because its scope ends: for types with a Drop implementation that runs their drop method; for a lock guard it releases the lock."

[implicit-return]
label = "implicit return"
explain = "The final expression supplies the return value of the function or closure."

[block-value]
label = "value of a block"
explain = "The variable takes the value the control flow below ends with (the last expression of a block or branch, or the value a loop leaves with)."

[lock]
label = "locks"
explain = "Waits until no other thread holds the lock, then holds it until the guard goes out of scope."

[runtime-borrow]
label = "borrow at run time"
explain = "RefCell checks the borrowing rules while the program runs: a second mutable borrow at the same time stops it with a panic."

[unsafe-attribute]
label = "unsafe attribute"
explain = "An attribute the compiler cannot check (no_mangle, export_name, link_section): the author vouches it is used correctly."

[lifetime]
label = "Reference lifetimes"
explain = "A lifetime name relates how long references must stay valid. It describes a constraint the compiler checks."
cue = "'a"
phase = "Compile time"
effects = [["Input and output both use 'a", "The compiler checks that the returned reference remains valid for the required lifetime"]]

[cfg]
label = "Build condition"
explain = "This declaration is compiled only when the condition matches the build configuration."

[raw-borrow]
label = "Raw borrow"
explain = "Create a raw pointer to a place. Its validity is the programmer's responsibility."
cue = "&raw"
phase = "Runtime"
effects = [["&raw const x", "Produce a raw pointer to x"]]

[match-guard]
label = "Match guard"
explain = "Check the guard after a pattern matches. If it fails, try the next pattern, including any remaining alternatives in the same arm."
cue = "if"
phase = "Runtime"
effects = [["Pattern matches and guard passes", "Take the arm"], ["Guard fails", "Try the next pattern or alternative"]]

[pattern-bind]
label = "Name a matched value"
explain = "Give the matched part a name and check it against the pattern to the right. The binding can move, copy, or borrow the value according to the usual rules."
cue = "@"
phase = "Runtime"
effects = [["Some(n @ 1..=3)", "Match Some containing 1, 2, or 3 and give that number the name n"]]

[pattern-alternative]
label = "Match either pattern"
explain = "The input can match any of the alternatives. Every alternative must bind the same names with the same types and binding modes."
cue = "|"
phase = "Runtime"
effects = [["Some(0 | 1)", "Match Some containing either 0 or 1"]]

[pattern-leading-bar]
label = "Optional first bar"
explain = "A bar before the first pattern lets it line up with the alternatives that follow. The bar itself adds no condition."
cue = "|"
phase = "Compile time"
effects = [["| None | Some(0)", "Match None or Some(0)"]]

[pattern-rest]
label = "Match the remaining parts"
explain = "The dots match any number of remaining elements or fields. In a slice pattern a name followed by @ can bind the matched elements."
cue = ".."
phase = "Runtime"
effects = [["[first, middle @ .., last]", "Name the elements between first and last as middle"], ["Point { x, .. }", "Bind x and leave the other fields unnamed"]]

[pattern-wildcard]
label = "Match and ignore one part"
explain = "Accept any value in this position. The wildcard creates no binding and leaves the matched value in place."
cue = "_"
phase = "Runtime"
effects = [["Some(_)", "Check for Some and ignore its inner value"]]

[tail-expression]
label = "Tail expression"
explain = "The trailing expression supplies the block's value."
cue = "tail"
phase = "Runtime"
effects = [["{ 42 }", "The block yields 42"], ["{ 42; }", "The block yields ()"]]

[range-open]
label = "Range open"
explain = "The end bound of this range is excluded when present."
cue = ".."
phase = "Runtime"
effects = [["1..3", "1, 2"]]

[range-inclusive]
label = "Range inclusive"
explain = "The end bound is included."
cue = "..="
phase = "Runtime"
effects = [["1..=3", "1, 2, 3"]]

[type-cast]
label = "Convert to another type"
explain = "The as keyword asks Rust to convert a value to the type written on the right. The rules depend on the input and destination types."
cue = "as"
effects = [["3.75_f64 as u16", "The result is the integer 3"]]

[explicit-type-args]
label = "Explicit generic arguments"
explain = "Supply generic arguments such as types, lifetimes, or constants. An underscore asks Rust to infer that part from context."
cue = "::<T>"
phase = "Compile time"
effects = [["parse::<i32>()", "Use i32 as the explicit result type argument"]]

[trait-contract]
label = "Trait contract"
explain = "A trait describes operations a type can provide. An impl connects a concrete type to this contract."
phase = "Compile time"

[type-parameters]
label = "Generic parameters"
explain = "These names stand for types, lifetimes or constants that are supplied or inferred when the declaration is used."
phase = "Compile time"

[trait-constraints]
label = "Trait and lifetime constraints"
explain = "The compiler checks the listed requirements. T: Trait means the type chosen for T must implement Trait."
phase = "Compile time"

[where-constraints]
label = "Where constraints"
explain = "The where clause lists requirements the type or lifetime arguments must satisfy."
phase = "Compile time"

[opaque-return]
label = "Return a type that implements a trait"
explain = "The function chooses a concrete return type. Callers can use the listed trait operations."
phase = "Compile time"

[generic-parameter-type]
label = "Accept a type that implements a trait"
explain = "The caller can supply any concrete type that satisfies the listed constraints."
phase = "Compile time"

[trait-object]
label = "Trait object"
explain = "Calls through dyn Trait select the concrete type's implementation at runtime."
phase = "Runtime"

[derive-traits]
label = "Generate trait implementations"
explain = "The derive attribute asks macros to generate implementations for the listed traits during compilation."
phase = "Compile time"

[macro-definition]
label = "Macro definition"
explain = "Rust matches the invocation's tokens against these rules and substitutes the chosen expansion during compilation."
phase = "Compile time"
