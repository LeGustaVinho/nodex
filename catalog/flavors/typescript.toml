# TypeScript and JavaScript flavors. Modifiers (public, private, readonly, ...) and
# decorators (attr:Name) are emitted as-is; the frontend shows unknown flavors as plain badges.

# --- Modules -------------------------------------------------------------------------------

[javascript]
label = "JavaScript"
explain = "Plain JavaScript: no type annotations. Nodex reads it with the same rules as TypeScript."

[declarations]
label = "declarations"
explain = "A .d.ts file: it only describes types of code that lives elsewhere. Nothing in it runs."

[barrel]
label = "barrel"
explain = "A module that only re-exports other modules (export * from ...), so importers can use one path."

[commonjs]
label = "CommonJS"
explain = "Uses require() and module.exports, the module system Node used before import/export."

[export]
label = "exported"
explain = "Other modules can import this."

[default-export]
label = "default export"
explain = "The module's default export: importers choose the name (import Anything from ...)."

# --- Types ---------------------------------------------------------------------------------

[type-only]
label = "type only"
explain = "Exists only while compiling. TypeScript erases it; at run time there is nothing to call or create."

[declare]
label = "declared"
explain = "Declared without an implementation (declare): the code that provides it lives elsewhere, often in JavaScript."

[overloaded]
label = "overloaded"
explain = "Has several signatures for different argument types; one implementation handles them all."

[parameter-property]
label = "from constructor"
explain = "A field declared by a constructor parameter (constructor(private repo: Repo)): the argument is stored in it."

[accessor]
label = "auto-accessor"
explain = "accessor field: TypeScript generates a getter and a setter around a private slot."

[settable]
label = "settable"
explain = "Has a set accessor: assigning to it runs code."

[optional]
label = "optional"
explain = "May be missing (undefined)."

[satisfies]
label = "satisfies"
explain = "Checked against a type while compiling without changing the value's own type. Does nothing at run time."

[non-null]
label = "non-null assertion"
explain = "The author asserts the value is not null or undefined (x!). Nothing is checked at run time."

# --- Functions -----------------------------------------------------------------------------

[generator]
label = "generator"
explain = "Produces a sequence of values one at a time (function*). Each yield pauses it until the next value is asked for."

[arrow]
label = "arrow function"
explain = "An arrow function (=>): it uses the this of the place where it is written."

[bound]
label = "bound"
explain = "A field holding an arrow function: this always refers to the instance, even when passed as a callback."

[this-binding]
label = "own this"
explain = "A function (not an arrow) that uses this: its value depends on how it is called."

[prototype]
label = "prototype method"
explain = "Added to a constructor's prototype: every object it creates shares this method (pre-class JavaScript)."

[base-constructor]
label = "base constructor"
explain = "super(...): runs the parent class's constructor."

[delegate]
label = "delegates"
explain = "yield*: produces every value of another sequence before continuing."

# --- Statements ----------------------------------------------------------------------------

[var]
label = "var"
explain = "Declared with var: visible in the whole function (hoisted), not only in its block."

[keys]
label = "property names"
explain = "for ... in: walks the names of an object's properties (including inherited ones), not its values."

[fallthrough]
label = "falls through"
explain = "This case has no break: after it runs, execution continues into the next case."

[short-circuit]
label = "short-circuit"
explain = "a && b(), a || b(): the right side runs only depending on the left side."

[value]
label = "value"
explain = "An expression evaluated for its value (or for nothing): no assignment and no call."

[with]
label = "with"
explain = "with (obj): names inside the block may refer to obj's properties. Forbidden in strict mode."

[debugger]
label = "debugger"
explain = "debugger: pauses here when a debugger is attached; otherwise does nothing."

[class]
label = "class"
explain = "A class declared inside a function."

[enum]
label = "enum"
explain = "An enum declared inside a function."

# --- Expressions ---------------------------------------------------------------------------

[truthiness]
label = "truthiness"
explain = "Tests a value as true/false: 0, \"\", null, undefined, NaN and false count as false; everything else as true."

[loose-equality]
label = "loose =="
explain = "== and != convert types before comparing (0 == \"\" is true). === and !== do not."

[fallback]
label = "fallback"
explain = "Uses the right side only when the left is null or undefined (??, ??=)."

[array-pipeline]
label = "array pipeline"
explain = "A chain of array operations (filter, map, reduce, ...): each stage receives the previous one's result."

[promise]
label = "promise chain"
explain = "A chain of .then/.catch/.finally: each callback runs later, when the previous step settles."

[jsx]
label = "JSX"
explain = "An element written as markup (<Button ... />): it creates a description of UI for React (or another library)."

[dynamic-import]
label = "dynamic import"
explain = "import(...): loads a module at run time and returns a promise for it."

[tagged-template]
label = "tagged template"
explain = "A function called with a template literal (tag`...`): it receives the text parts and the values."

[class-expression]
label = "class value"
explain = "A class created as a value (class { ... }), for example by a mixin."

[typeof]
label = "typeof"
explain = "Checks the run-time type name (\"string\", \"number\", \"object\", ...). TypeScript narrows the type after it."

[instanceof]
label = "instanceof"
explain = "Checks whether the object was created by a class (or one derived from it)."

[in]
label = "in"
explain = "Checks whether an object has a property with this name."

# --- Events and timers ---------------------------------------------------------------------

[once]
label = "once"
explain = "The handler runs only the first time; then it is removed."

[handler-property]
label = "handler property"
explain = "Assigning to an on... property (button.onclick = f) replaces the single handler."

[repeating]
label = "repeating"
explain = "setInterval: runs again and again until cleared."

[destructure]
label = "unpacks"
explain = "Takes several values out of an object or array at once."

# --- Added by the syntax review ------------------------------------------------------------

[object]
label = "object"
explain = "An object literal that holds functions (const api = { get() { … } }, module.exports = { … }): each function has its own Blueprint under it."

[object-member]
label = "object member"
explain = "A function written inside an object literal; this refers to the object when called as obj.member()."

[iife]
label = "runs immediately"
explain = "A function called right where it is written, (async () => { … })(): scripts often keep their main logic in one."

[exhaustive-check]
label = "exhaustive check"
explain = "x satisfies never (or a never-typed variable): the compiler fails if a case of a union was not handled before this point. Nothing happens at run time."

[module-augmentation]
label = "augments a module"
explain = "declare module \"x\" { … }: adds declarations to another module's types, for example new fields on a library's request object."

[global-augmentation]
label = "augments globals"
explain = "declare global { … }: adds declarations to the global scope, such as fields on Window."

# --- Frameworks: React ---------------------------------------------------------------------------

["react:component"]
label = "React component"
explain = "React calls this function (or class) to render part of the page, and again whenever its props or state change. What it returns is what is shown."

["react:lifecycle"]
label = "React lifecycle"
explain = "A class component method that React calls at a specific moment (after mounting, before removal, on every render)."

["react:hook"]
label = "hook"
explain = "A function whose name starts with use: it can keep state and effects for the component that calls it, on every render."

["react:effect"]
label = "effect"
explain = "Code React runs after rendering, when the listed values changed (useEffect). The function it returns runs as clean-up."

["react:state"]
label = "state"
explain = "A value React keeps between renders (useState, useReducer). Changing it with its setter makes the component render again."

["react:set-state"]
label = "changes state"
explain = "Changes React state: the component renders again with the new value (after this code finishes, not immediately)."

["react:ref"]
label = "ref"
explain = "useRef: a box whose .current survives renders; changing it does not render again."

["react:memo"]
label = "memoized"
explain = "React keeps the result (or function) from the previous render and recomputes it only when the listed values change."

["react:context"]
label = "context"
explain = "Reads a value provided higher in the component tree, without passing it through every component."

["react:callback"]
label = "useCallback"
explain = "A function React keeps between renders, recreated only when the listed values change."

["react:forward-ref"]
label = "forwards ref"
explain = "forwardRef: the parent can get a ref to an element inside this component."

# --- Frameworks: Vue -----------------------------------------------------------------------------

["vue:component"]
label = "Vue component"
explain = "A Vue component: Vue creates it, calls its lifecycle options and re-renders its template when its reactive data changes."

["vue:setup"]
label = "setup"
explain = "The top level of <script setup>: Vue runs it once for every instance of the component."

["vue:lifecycle"]
label = "Vue lifecycle"
explain = "Vue calls this at a moment of the component's life (created, mounted, updated, unmounted)."

["vue:watch"]
label = "watcher"
explain = "Code Vue runs again whenever the watched reactive value changes."

["vue:computed"]
label = "computed"
explain = "A value Vue recalculates only when the reactive values it reads change, and caches otherwise."

["vue:ref"]
label = "ref"
explain = "ref(): a reactive value; reading and writing .value lets Vue track it and update the template."

["vue:reactive"]
label = "reactive"
explain = "reactive(): an object whose properties Vue tracks; changing them updates the template."

["vue:props"]
label = "props"
explain = "Values the parent component passes in. Read-only for this component."

["vue:emits"]
label = "emits"
explain = "The events this component can raise to its parent (defineEmits)."

["vue:emit"]
label = "emits to parent"
explain = "Raises an event the parent component listens to in its template (@name)."

["vue:model"]
label = "v-model"
explain = "A value shared two ways with the parent through v-model."

["vue:method"]
label = "method"
explain = "A component method, usually called from the template (@click) or from other options."

["vue:composable"]
label = "composable"
explain = "A function from the app or a library (use...) that provides reactive state or services to the component."

# --- Frameworks: Angular -------------------------------------------------------------------------

["angular:component"]
label = "Angular component"
explain = "@Component: Angular creates it for its selector in templates, injects its constructor parameters and calls its lifecycle hooks."

["angular:directive"]
label = "directive"
explain = "@Directive: adds behavior to existing elements in templates."

["angular:pipe"]
label = "pipe"
explain = "@Pipe: a value transformation used in templates ({{ value | name }})."

["angular:service"]
label = "service"
explain = "@Injectable: Angular creates it and passes it to whoever asks for it (dependency injection)."

["angular:module"]
label = "NgModule"
explain = "@NgModule: groups components, directives and providers."

["angular:lifecycle"]
label = "Angular lifecycle"
explain = "A hook Angular calls at a moment of the component's life (ngOnInit, ngOnChanges, ngOnDestroy, ...)."

["angular:input"]
label = "input"
explain = "A value the parent template sets ([name]). Angular updates it when the parent's value changes."

["angular:output"]
label = "output"
explain = "An event the parent template can listen to ((name)); emitting it calls the parent's handler."

["angular:inject"]
label = "injected"
explain = "Angular provides this object (dependency injection): the class does not create it."

["angular:signal"]
label = "signal"
explain = "A reactive value: reading it in a template or computed() makes Angular update when it changes."

["angular:effect"]
label = "effect"
explain = "Code Angular runs again whenever a signal it reads changes."

["angular:host-listener"]
label = "host listener"
explain = "@HostListener: Angular calls this method when the host element (or window/document) raises the event."

["angular:host-binding"]
label = "host binding"
explain = "@HostBinding: this value is written to a property or attribute of the host element."

["angular:view-query"]
label = "view query"
explain = "@ViewChild/@ViewChildren: Angular fills this with elements of the component's own template."

["angular:content-query"]
label = "content query"
explain = "@ContentChild/@ContentChildren: Angular fills this with elements projected into the component."

["rxjs:subscribe"]
label = "subscription"
explain = "Runs the callback for every value the observable emits, until unsubscribed."

[rx-pipeline]
label = "RxJS pipeline"
explain = "source.pipe(op1, op2, ...): every emitted value flows through the operators in order."

# --- Frameworks: Node.js -------------------------------------------------------------------------

["node:route"]
label = "route"
explain = "The web framework calls this handler when a request with this method and path arrives."

["node:middleware"]
label = "middleware"
explain = "Runs for every request (or every request under a path) before its route; it calls next() to continue."

["node:listen"]
label = "listen"
explain = "The server starts accepting connections; the callback runs once it is ready."

["node:server"]
label = "server"
explain = "The callback runs for every request the server receives."

["node:app"]
label = "web app"
explain = "A web application or router object; routes and middleware are registered on it."

["node:exit"]
label = "exits"
explain = "process.exit: the program ends here; pending work (timers, I/O) does not finish."

["node:blocking"]
label = "blocking"
explain = "A synchronous Node.js call: the whole program waits until it finishes (no other request or timer runs meanwhile)."

["node:process"]
label = "child process"
explain = "Runs another program in a separate process."

["node:worker"]
label = "worker thread"
explain = "Runs a script on another thread, in parallel with this one."

[event-handler]
label = "event handler"
explain = "Code that runs when the object raises this event; it may run many times."
