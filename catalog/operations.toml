# =============================================================================================
# Logic
# =============================================================================================

[operations.and]
title = "And"
symbol = "and"
family = "logic"
pure = true
inputs = ["A:bool", "B:bool"]
output = "Result:bool"
explain = "True when both are true. B is only evaluated when A is true (short-circuit)."
cs = "a && b"
ts = "a && b"
rs = "a && b"

[operations.or]
title = "Or"
symbol = "or"
family = "logic"
pure = true
inputs = ["A:bool", "B:bool"]
output = "Result:bool"
explain = "True when at least one is true. B is only evaluated when A is false (short-circuit). In TypeScript the result is A itself when it is truthy."
cs = "a || b"
ts = "a || b"
rs = "a || b"

[operations.not]
title = "Not"
symbol = "not"
family = "logic"
pure = true
inputs = ["Value:bool"]
output = "Result:bool"
explain = "The opposite: true becomes false and false becomes true."
cs = "!a"
ts = "!a"
rs = "!a"

[operations.xor]
title = "Exclusive or"
symbol = "xor"
family = "logic"
pure = true
inputs = ["A:bool", "B:bool"]
output = "Result:bool"
explain = "True when exactly one of them is true."
cs = "a ^ b (booleans)"
ts = "a !== b (booleans)"
rs = "a ^ b"

