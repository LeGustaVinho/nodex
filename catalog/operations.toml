# Nodex operation catalog — operations every language has, drawn as the same node everywhere.
#
# Consumed by: nodex-core (recognition of library calls, validation, /api/catalog), the web
# frontend (titles, symbols, pins, colors, "in other languages") and the Obsidian reference note
# "Operation Catalog". Operators (`+`, `>=`, `&&`) are recognized by each language frontend, which
# sets `Expr::op` to the key; library calls are recognized by the patterns below.
#
# Fields:
#   title   — node title                         symbol — short symbol shown in the header
#   family  — key in [families] (color)          pure   — false: stays on the execution chain
#   inputs  — "Name:type" pins, in argument order (the receiver first for methods)
#   output  — "Name:type", or "" when it returns nothing
#   explain — plain language
#   cs / ts / rs — how it is written in C#, TypeScript and Rust (shown in the inspector)
#   calls_cs / calls_ts / calls_rs — call patterns that mean this operation:
#       "Math.Max()"   call on that receiver (or a target named so)
#       "*.ToUpper()"  method call on any receiver (the receiver is the first input)
#       "*.Length"     property read on any receiver
#       "~random|rng.Next()"  method call on a receiver that looks like one of the words (a
#                      variable named `_random` or `rng`, `new Random()`), or that a compiler
#                      resolved to the standard library; for names too common to trust alone
#       "parseInt()"   free function
# Types: number, text, bool, list, map, any, time.

[families.math]
title = "Math"
color = "#2e9e5b"

[families.compare]
title = "Comparison"
color = "#d4a017"

[families.logic]
title = "Logic"
color = "#c0504d"

[families.bits]
title = "Bits"
color = "#7d6e9e"

[families.text]
title = "Text"
color = "#d6658f"

[families.list]
title = "Collections"
color = "#e08a2c"

[families.convert]
title = "Conversion"
color = "#3a8fb7"

[families.time]
title = "Time"
color = "#5aa0a0"

[families.io]
title = "Input / output"
color = "#8a6d3b"

[families.object]
title = "Objects"
color = "#5d7fa3"

[families.async]
title = "Asynchrony"
color = "#16a085"

[families.error]
title = "Errors"
color = "#a93226"

# =============================================================================================
# Math — operators
# =============================================================================================

[operations.add]
title = "Add"
symbol = "+"
family = "math"
pure = true
inputs = ["A:number", "B:number"]
output = "Result:number"
explain = "A plus B."
cs = "a + b"
ts = "a + b"
rs = "a + b"

[operations.subtract]
title = "Subtract"
symbol = "−"
family = "math"
pure = true
inputs = ["A:number", "B:number"]
output = "Result:number"
explain = "A minus B."
cs = "a - b"
ts = "a - b"
rs = "a - b"

[operations.multiply]
title = "Multiply"
symbol = "×"
family = "math"
pure = true
inputs = ["A:number", "B:number"]
output = "Result:number"
explain = "A times B."
cs = "a * b"
ts = "a * b"
rs = "a * b"

[operations.divide]
title = "Divide"
symbol = "÷"
family = "math"
pure = true
inputs = ["A:number", "B:number"]
output = "Result:number"
explain = "A divided by B. With two integers, C# and Rust drop the fraction (7 / 2 = 3); TypeScript keeps it (3.5)."
cs = "a / b"
ts = "a / b"
rs = "a / b"

[operations.remainder]
title = "Remainder"
symbol = "%"
family = "math"
pure = true
inputs = ["A:number", "B:number"]
output = "Result:number"
explain = "What is left after dividing A by B (7 % 3 = 1). Often used to test even/odd."
cs = "a % b"
ts = "a % b"
rs = "a % b"

[operations.power]
title = "Power"
symbol = "^"
family = "math"
pure = true
inputs = ["Base:number", "Exponent:number"]
output = "Result:number"
explain = "Base raised to Exponent (2 ^ 3 = 8)."
cs = "Math.Pow(a, b)"
ts = "a ** b, Math.pow(a, b)"
rs = "a.powf(b), a.pow(b)"
calls_cs = ["Math.Pow()", "Mathf.Pow()"]
calls_ts = ["Math.pow()"]
calls_rs = ["*.pow()", "*.powf()", "*.powi()"]

[operations.negate]
title = "Negate"
symbol = "−x"
family = "math"
pure = true
inputs = ["Value:number"]
output = "Result:number"
explain = "The value with the opposite sign."
cs = "-a"
ts = "-a"
rs = "-a"

[operations.plus]
title = "To number"
symbol = "+x"
family = "math"
pure = true
inputs = ["Value:any"]
output = "Result:number"
explain = "Unary plus: the value itself (in TypeScript it also converts text to a number)."
cs = "+a"
ts = "+a"
rs = ""

[operations.increment]
title = "Increment"
symbol = "++"
family = "math"
pure = false
inputs = ["Variable:number"]
output = "Result:number"
explain = "Adds 1 to the variable."
cs = "i++, ++i"
ts = "i++, ++i"
rs = "i += 1"

[operations.decrement]
title = "Decrement"
symbol = "−−"
family = "math"
pure = false
inputs = ["Variable:number"]
output = "Result:number"
explain = "Subtracts 1 from the variable."
cs = "i--, --i"
ts = "i--, --i"
rs = "i -= 1"

