[package]
name = "nodex-server"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Local Nodex server: serves the web UI, the project API and live updates"

[[bin]]
name = "nodex"
path = "src/main.rs"

[dependencies]
nodex-ir.workspace = true
nodex-core.workspace = true
nodex-lang-api.workspace = true
nodex-lang-csharp.workspace = true
nodex-lang-typescript.workspace = true
nodex-lang-rust.workspace = true
nodex-trace.workspace = true
nodex-uml.workspace = true
ts-rs.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
axum.workspace = true
form_urlencoded = "1"
rust-embed.workspace = true
mime_guess.workspace = true
clap.workspace = true
getrandom.workspace = true
open.workspace = true
notify.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-appender.workspace = true
nodex-dap.workspace = true
ureq = "3"
sha2 = "0.11"
zip = { version = "9", default-features = false, features = ["deflate"] }
flate2 = "1"
tar = "0.4"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
tokio-tungstenite = "0.29"
futures-util = "0.3"
axum.workspace = true
