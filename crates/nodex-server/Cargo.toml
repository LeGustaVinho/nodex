[package]
name = "nodex-server"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Local Nodex server: serves the web UI, the project API and live updates"

[[bin]]
name = "nodex"
path = "src/main.rs"

[dependencies]
nodex-ir.workspace = true
nodex-core.workspace = true
nodex-lang-api.workspace = true
nodex-lang-csharp.workspace = true
nodex-lang-typescript.workspace = true
nodex-lang-rust.workspace = true
nodex-trace.workspace = true
ts-rs.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
axum.workspace = true
rust-embed.workspace = true
mime_guess.workspace = true
clap.workspace = true
getrandom.workspace = true
open.workspace = true
notify.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
