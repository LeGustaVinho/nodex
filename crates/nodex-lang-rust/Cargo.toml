[package]
name = "nodex-lang-rust"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Rust language frontend for Nodex (tree-sitter lowering to the Nodex IR, rust-analyzer semantics, trace instrumentation)"

[dependencies]
nodex-ir.workspace = true
nodex-lang-api.workspace = true
tree-sitter.workspace = true
tree-sitter-rust.workspace = true
serde_json.workspace = true
toml.workspace = true
scip.workspace = true
protobuf = "3"
icu_normalizer = { version = "2", default-features = false, features = ["compiled_data"] }

[dev-dependencies]
insta.workspace = true
