[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/gustavo/nodex"

[workspace.dependencies]
nodex-ir = { path = "crates/nodex-ir" }
nodex-lang-api = { path = "crates/nodex-lang-api" }
nodex-core = { path = "crates/nodex-core" }
nodex-lang-csharp = { path = "crates/nodex-lang-csharp" }
nodex-lang-typescript = { path = "crates/nodex-lang-typescript" }
nodex-lang-rust = { path = "crates/nodex-lang-rust" }
nodex-dap = { path = "crates/nodex-dap" }
nodex-trace = { path = "crates/nodex-trace" }
nodex-uml = { path = "crates/nodex-uml" }
nodex-server = { path = "crates/nodex-server" }

anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
blake3 = "1"
tree-sitter = "0.25"
tree-sitter-c-sharp = "0.23"
tree-sitter-typescript = "0.23"
tree-sitter-rust = "0.24"
scip = "0.10"
ts-rs = { version = "12", features = ["serde-compat", "no-serde-warnings"] }
rayon = "1"
walkdir = "2"
notify = "8"
tokio = { version = "1", features = ["full"] }
axum = { version = "0.8", features = ["ws"] }
tower-http = { version = "0.6", features = ["trace", "cors"] }
rust-embed = "8"
mime_guess = "2"
clap = { version = "4", features = ["derive"] }
getrandom = "0.3"
open = "5"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
insta = { version = "1", features = ["yaml"] }

[profile.dev.package."*"]
opt-level = 2
